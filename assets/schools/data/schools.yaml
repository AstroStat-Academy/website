# ════════════════════════════════════════════════════════════════════
#  AstroStat School — single source of truth for the Schools page.
#
#  HOW TO ADD THE NEXT EDITION
#  ────────────────────────────
#  1. Add a new block at the TOP of `editions:` (newest first).
#  2. The first entry is ALWAYS the featured / next edition — it gets
#     the big hero card and the red, pulsing marker on the globe.
#  3. While the programme is not public yet, set `upcoming: true`. The
#     hero then reads "Next edition" and shows "Programme · To be
#     announced". Once you have the line-up, delete `upcoming:` and add
#     a `topics:` list — the hero swaps the note for topic chips.
#  4. `lat` / `lon` place the city on the globe. Editions that share a
#     city are grouped and counted automatically (e.g. Crete ×5), so
#     just give each Crete edition the same coordinates.
#
#  Per-edition fields:
#     ed        edition number (shown as № 0N)
#     city      host city            country   host country
#     venue     hosting institution  date      actual dates ("16–20 Jun 2025")
#     lat, lon  globe coordinates    url       link to that edition's site
#     thumbnail local image from the edition website
#     materials optional github / gitbook links to edition teaching materials
#     topics    optional list of programme topics
#     upcoming  optional · true while the programme is TBA
#     founding  optional · true for the first-ever edition
# ════════════════════════════════════════════════════════════════════

meta:
  eyebrow: Schools · Editions
  title: The AstroStat School
  blurb: >-
    Since 2019, the School has helped early-career researchers and data
    scientists bridge the gap to modern statistics and machine learning.
    Each edition below links out to its own page.
  # Header tallies. `prefix: true` renders the label before the value
  # ("since 2019" instead of "2019 since"). Values marked `auto` are
  # computed at load time from the data: `editions` = exact number of
  # editions below; `alumni` (accepted participants) and `countries`
  # (distinct institute country + nationality) are floored to the
  # nearest 10 with a trailing "+". `since` is fixed.
  stats:
    - { value: "8",    label: editions,  auto: editions }
    - { value: "2019", label: since, prefix: true }
    - { value: "60+",  label: "countries reached" }

