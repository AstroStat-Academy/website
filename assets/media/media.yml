# ════════════════════════════════════════════════════════════════════
#  AstroStat Academy — Gallery page (SOURCE OF TRUTH).
#
#  Two blocks, two top-level keys:
#
#    events:  our own photos and videos, one entry per edition. The
#             page shows ONE edition at a time, picked from the
#             dropdown at the top of the block.
#    press:   public outreach — articles, interviews, radio and TV
#             segments about us, published by someone else.
#
#  TO CHANGE THE PAGE — edit THIS file only. Drop the media files
#  under assets/media/photos/<event-id>/ or assets/media/videos/<event-id>/
#  and reference them below; a file on disk that is not listed here
#  does not appear on the page (so nothing is lost when you remove a
#  line — delete it, re-add it later).
#
#  ── events ─────────────────────────────────────────────────────────
#  Each entry is one edition and one line in the dropdown. The FIRST
#  entry is the one that opens, so keep the newest edition on top.
#
#    id      folder name under photos/ and videos/ (also the anchor)
#    event   full name, shown in the meta line
#    tab     short label for the dropdown. QUOTE IT, or "06" becomes
#            the number 6. Falls back to `event`.
#    place   venue, city, country
#    date    free text; the trailing 4-digit year is pulled out and
#            set larger, as on the Schools page ("27–31 Jul 2026")
#    video   ONE video per edition — it fills the left column:
#              file     path relative to /assets/media/
#              caption  one line, under the player
#              poster   optional still frame, relative to /assets/media/.
#                       Without it the browser shows the first frame.
#            Omit the whole key when an edition has no video.
#    photos  ordered list for the contact sheet on the right. The first
#            one opens as the lead frame, so lead with your best. Each:
#              file     path relative to /assets/media/
#              caption  one line, shown under the lead frame
#              thumb    optional. By default the strip looks for the same
#                       name under a thumbs/ folder beside the photo
#                       (photos/<id>/thumbs/<name>) and falls back to the
#                       full frame when that file does not exist. Generate
#                       thumbs — the strip should never pull full frames.
#
#  ── press ──────────────────────────────────────────────────────────
#    date    YYYY-MM-DD (day may be omitted: YYYY-MM or YYYY)
#    outlet  publication or broadcaster
#    kind    article | interview | radio | tv | web
#    title   the headline. Translate it when the piece is not in English —
#            the page is English, and `lang` already flags the original.
#    title_original
#            optional. The headline as published, kept on record when `title`
#            is a translation; shown on hover over the headline.
#    note    one or two sentences of context under the headline: who published
#            it and what the piece actually covers. Write it for a reader who
#            will not follow the link — the headline alone rarely says whether
#            a piece is worth opening.
#    url     external link — opens in a new tab
#    lang    2-letter code, shown as a tag when it is not "en"
#    youtube optional YouTube id (the part after "watch?v="). When present the
#            report is embedded under the entry, played from youtube-nocookie
#            so viewers are not tracked before they press play.
# ════════════════════════════════════════════════════════════════════

